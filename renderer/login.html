<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تسجيل الدخول - سيستم كاشير</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh;">
  <div class="card-box" style="width:380px;">
    <div style="text-align:center;">
      <img src="assets/login-emblem.png" alt="الشعار" style="width:190px;height:auto;" />
    </div>
    <p style="text-align:center;color:var(--text-dim);margin-top:4px;">نظام نقطة البيع</p>
    <div id="loginSection">
      <div class="form-row">
        <label>اسم المستخدم</label>
        <input id="username" autofocus />
      </div>
      <div class="form-row">
        <label>الرقم السري (PIN)</label>
        <input id="pin" type="password" />
      </div>
      <button class="primary" id="loginBtn">دخول</button>
    </div>
    <div id="setupSection" style="display:none;">
      <p style="text-align:center;">أول تشغيل: أنشئ حساب المدير</p>
      <div class="form-row">
        <label>اسم المستخدم للمدير</label>
        <input id="setupUsername" />
      </div>
      <div class="form-row">
        <label>الرقم السري (PIN)</label>
        <input id="setupPin" type="password" />
      </div>
      <div class="form-row">
        <label>تأكيد الرقم السري</label>
        <input id="setupPinConfirm" type="password" />
      </div>
      <button class="primary" id="setupBtn">إنشاء حساب المدير</button>
    </div>
    <div id="changePinSection" style="display:none;">
      <p style="text-align:center;">لازم تغيّر الرقم السري قبل المتابعة</p>
      <div class="form-row">
        <label>الرقم السري الجديد</label>
        <input id="newPin" type="password" />
      </div>
      <div class="form-row">
        <label>تأكيد الرقم السري الجديد</label>
        <input id="newPinConfirm" type="password" />
      </div>
      <button class="primary" id="changePinBtn">حفظ ومتابعة</button>
    </div>
    <p id="errorMsg" style="color:var(--danger);display:none;"></p>
  </div>
  <script src="login.js"></script>
</body>
</html>
