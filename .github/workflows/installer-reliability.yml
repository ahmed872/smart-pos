name: Installer Reliability

# Investigation workflow: builds the Windows installer once per runner and installs it repeatedly,
# recording every attempt and any crash evidence. Never publishes anything.
on:
  push:
    branches:
      - 'claude/installer-reliability'
  workflow_dispatch:
    inputs:
      attempts:
        description: 'Installations per runner'
        required: false
        default: '40'

permissions:
  contents: read

jobs:
  stress:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [a, b, c]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Repeated installation test
        shell: pwsh
        run: ./scripts/ci/installer-stress.ps1 -Attempts ${{ github.event.inputs.attempts || 40 }} -Label ${{ matrix.runner }}

      - name: Upload results and crash dumps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-stress-${{ matrix.runner }}
          path: ${{ runner.temp }}/installer-stress-${{ matrix.runner }}
          retention-days: 7
