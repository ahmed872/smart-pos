name: Build and Release Smart POS

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار (مثال v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Code signing is optional until a certificate is configured (see docs/CODE_SIGNING.md).
      # Only whether the secret exists is exposed here, never its value.
      HAS_SIGNING_CERT: ${{ secrets.WIN_CSC_LINK != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Clean install of exactly the versions pinned in package-lock.json (fails if it is out of sync).
      - name: Install dependencies
        run: npm ci

      # No release is built if any test fails.
      - name: Run tests
        run: npm test

      - name: Build Windows installer (unsigned, no certificate configured)
        if: env.HAS_SIGNING_CERT != 'true'
        run: npm run dist

      # electron-builder signs the app executable, the uninstaller and the installer with this
      # certificate (base64 .pfx or https link in WIN_CSC_LINK). The secrets exist only in this step.
      - name: Build Windows installer (signed)
        if: env.HAS_SIGNING_CERT == 'true'
        run: npm run dist
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      # Reports the Authenticode status of what is published. A configured certificate must produce
      # valid signatures; repository variable REQUIRE_CODE_SIGNING=true refuses unsigned releases.
      - name: Check code signature
        shell: pwsh
        run: |
          $require = $env:HAS_SIGNING_CERT -eq 'true' -or '${{ vars.REQUIRE_CODE_SIGNING }}' -eq 'true'
          ./scripts/ci/check-signature.ps1 -Require:$require

      - name: Determine release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # The installer's version comes from package.json; refuse to publish it under another tag.
      - name: Check tag matches package version
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${{ steps.tag.outputs.name }}" ]; then
            echo "tag ${{ steps.tag.outputs.name }} does not match package.json version $pkg"; exit 1
          fi

      # Release notes are taken from release-notes/<tag>.md when that file exists.
      - name: Find release notes
        id: notes
        shell: bash
        run: |
          f="release-notes/${{ steps.tag.outputs.name }}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi

      - name: Upload installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          # A tag created by this release points at exactly the commit that was built and tested.
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: dist/*.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
