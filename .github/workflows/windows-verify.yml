name: Windows Verification

# Builds and verifies the Windows installer on every branch push, without publishing anything.
# Releases are only produced by build-release.yml.
on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Build Windows installer
        run: npm run dist

      - name: Check Electron fuses on the packaged binary
        shell: pwsh
        run: |
          $out = npx @electron/fuses read --app "dist/win-unpacked/Cashier System.exe" | Out-String
          Write-Host $out
          foreach ($line in @('RunAsNode is Disabled', 'EnableNodeOptionsEnvironmentVariable is Disabled',
                              'EnableNodeCliInspectArguments is Disabled', 'OnlyLoadAppFromAsar is Enabled')) {
            if ($out -notmatch [regex]::Escape($line)) { throw "fuse check failed: $line" }
          }

      - name: Upload installer for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          retention-days: 7

      - name: Packaged app - install and first run
        shell: pwsh
        run: ./scripts/ci/windows-packaged-smoke.ps1 -Phase FirstRun

      # Test-only tool, installed outside the project so node_modules stays exactly as in the lockfile.
      - name: Install Playwright (test tool only)
        shell: pwsh
        run: npm install --no-save --prefix "$env:RUNNER_TEMP\pw" playwright-core@1.56.1

      - name: Functional end-to-end test on Windows
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_CORE = "$env:RUNNER_TEMP\pw\node_modules\playwright-core"
          node scripts/ci/e2e-functional.js

      # Same functional checks against the packaged application contents (app.asar after
      # electron-builder's file filtering): proves nothing the runtime needs was excluded.
      - name: Functional end-to-end test on the packaged app.asar
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_CORE = "$env:RUNNER_TEMP\pw\node_modules\playwright-core"
          $env:E2E_APP_DIR = "$PWD\dist\win-unpacked\resources\app.asar"
          node scripts/ci/e2e-functional.js

      - name: Packaged app - existing data, hardening, uninstall and reinstall
        shell: pwsh
        run: ./scripts/ci/windows-packaged-smoke.ps1 -Phase Existing

  # Upgrade from each released version: its own installer (from the GitHub Release) and its own code
  # (from the tag) create real customer data and a backup; this build is then installed over it.
  upgrade:
    name: upgrade-from-${{ matrix.from }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        from: [v1.1.0, v1.2.0]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies (lockfile only)
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Prepare ${{ matrix.from }} (code from its tag, installer from its GitHub Release)
        shell: pwsh
        run: |
          $from = '${{ matrix.from }}'
          git worktree add "$env:RUNNER_TEMP\old" $from
          Push-Location "$env:RUNNER_TEMP\old"
          npm ci
          npx electron-builder install-app-deps
          Pop-Location
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/$from/Cashier.System.Setup.$($from.TrimStart('v')).exe" -OutFile "$env:RUNNER_TEMP\old-setup.exe"
          npm install --no-save --prefix "$env:RUNNER_TEMP\pw" playwright-core@1.56.1

      - name: Install released ${{ matrix.from }} and create customer data with it
        shell: pwsh
        run: |
          # v1.1.0's installer has the intermittent 0xC0000005 start-up crash fixed in v1.2.0, so
          # only that OLD installer is retried.
          $attempts = if ('${{ matrix.from }}' -eq 'v1.1.0') { 3 } else { 1 }
          for ($i = 1; $i -le $attempts; $i++) {
            $p = Start-Process "$env:RUNNER_TEMP\old-setup.exe" -ArgumentList '/S' -Wait -PassThru
            Write-Host "${{ matrix.from }} install attempt $i exit=$($p.ExitCode)"
            if ($p.ExitCode -eq 0) { break }
          }
          if ($p.ExitCode -ne 0) { throw '${{ matrix.from }} installer failed' }
          $env:PLAYWRIGHT_CORE = "$env:RUNNER_TEMP\pw\node_modules\playwright-core"
          node "$env:RUNNER_TEMP\old\scripts\ci\e2e-functional.js"
          if ($LASTEXITCODE) { throw '${{ matrix.from }} functional run failed' }
          $env:E2E_APP_DIR = "$env:RUNNER_TEMP\old"
          node scripts/ci/upgrade-seed.js "$env:RUNNER_TEMP\snapshot.json"
          if ($LASTEXITCODE) { throw 'seeding ${{ matrix.from }} data failed' }

      - name: Upgrade to this build and verify customer data
        shell: pwsh
        run: ./scripts/ci/windows-upgrade.ps1 -Snapshot "$env:RUNNER_TEMP\snapshot.json" -FromVersion '${{ matrix.from }}'
